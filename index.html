<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand" onclick="go('dashboard')">
        <div class="brand-logo2"><span>晓东<br>高定</span></div>
        <div class="brand-text">
          <div class="t1">主持人晓东 · 高定婚礼</div>
          <div class="t2">Xiaodong Haute Wedding</div>
        </div>
      </div>
      <nav class="tabs">
        <button class="tab active" id="tab-dashboard" onclick="go('dashboard')">仪表盘</button>
        <button class="tab" id="tab-couples" onclick="go('couples')">新人档案</button>
      </nav>
    </div>
  </header>

  <main id="main"></main>
</div>

<div class="modal-mask" id="modal-mask" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-box"></div>
</div>
<div id="toast-wrap"></div>

<script>
/* ================= 数据层 ================= */
const LS_KEY = 'wedding-mc-workbench-v2';

function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY) || localStorage.getItem('wedding-mc-workbench-v1');
    if(raw){ const d = JSON.parse(raw); if(d && Array.isArray(d.couples)) return d; }
  }catch(e){}
  return { couples: [] };
}
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch(e){ toast('保存失败：本地存储不可用'); }
}
let state = loadState();

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function getCouple(id){ return state.couples.find(c => c.id === id); }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function fmtDate(s){
  if(!s) return '—';
  const d = new Date(s + 'T00:00:00');
  if(isNaN(d)) return s;
  const wk = ['日','一','二','三','四','五','六'][d.getDay()];
  return `${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日 · 周${wk}`;
}
function daysUntil(dateStr){
  if(!dateStr) return null;
  const now = new Date(); now.setHours(0,0,0,0);
  const d = new Date(dateStr + 'T00:00:00');
  return Math.round((d - now) / 86400000);
}
function nearestCouple(){
  const upcoming = state.couples
    .filter(c => c.date && daysUntil(c.date) >= 0)
    .sort((a,b) => a.date < b.date ? -1 : 1);
  if(upcoming.length) return { couple: upcoming[0], past: false };
  if(!state.couples.length) return null;
  const all = [...state.couples].filter(c => c.date).sort((a,b) => a.date > b.date ? -1 : 1);
  if(all.length) return { couple: all[0], past: true };
  return { couple: state.couples[0], past: true };
}
function allOpenTodos(){
  const list = [];
  state.couples.forEach(c => (c.comms||[]).forEach(cm => (cm.todos||[]).forEach(t => {
    if(!t.done) list.push({ coupleId:c.id, coupleName: coupleLabel(c), commId:cm.id, todo:t });
  })));
  return list;
}
function coupleLabel(c){ return `${c.groom||'新郎'} & ${c.bride||'新娘'}`; }

/* ================= 视图路由 ================= */
let view = { name:'dashboard', coupleId:null, tab:'comm' };
function go(name, coupleId){
  view = { name, coupleId: coupleId || null, tab: 'comm' };
  render();
  window.scrollTo({ top:0, behavior:'smooth' });
}
function goTab(tab){ view.tab = tab; render(); }
function openCouple(id){ go('detail', id); }

/* ================= 通用 UI ================= */
function toast(msg){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = '<span class="dot"></span>' + esc(msg);
  wrap.appendChild(el);
  setTimeout(() => { el.classList.add('hide'); setTimeout(() => el.remove(), 350); }, 2200);
}
function openModal(html){ document.getElementById('modal-box').innerHTML = html; document.getElementById('modal-mask').classList.add('show'); }
function closeModal(){ document.getElementById('modal-mask').classList.remove('show'); }
function confirmBox(title, msg, okText, onOk){
  window.__confirmOk = () => { closeModal(); onOk(); };
  openModal(`
    <h3>${esc(title)}</h3>
    <div class="m-sub">${esc(msg)}</div>
    <div class="m-btns">
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">取消</button>
      <button class="btn btn-danger btn-sm" onclick="__confirmOk()">${esc(okText||'确认删除')}</button>
    </div>`);
}

/* ================= 渲染主入口 ================= */
function render(){
  document.getElementById('tab-dashboard').classList.toggle('active', view.name === 'dashboard');
  document.getElementById('tab-couples').classList.toggle('active', view.name === 'couples');
  const main = document.getElementById('main');
  if(view.name === 'dashboard') main.innerHTML = viewDashboard();
  else if(view.name === 'couples') main.innerHTML = viewCouples();
  else main.innerHTML = viewDetail();
  startCountdownTicker();
}

/* ================= 仪表盘 ================= */
function viewDashboard(){
  const total = state.couples.length;
  const todos = allOpenTodos();
  const near = nearestCouple();
  let hero;
  if(!near){
    hero = `
      <div class="card hero">
        <div class="over">Next Ceremony</div>
        <div class="names">尚未录入新人档案</div>
        <div class="meta">点击「新人档案」开始建立你的第一场婚礼</div>
        <button class="btn btn-gold" onclick="go('couples')">去添加新人</button>
      </div>`;
  } else {
    const c = near.couple;
    const d = daysUntil(c.date);
    hero = `
      <div class="card hero ${near.past?'done':''}">
        <div class="over">${near.past ? '最近一场婚礼' : '下一场婚礼 · Countdown'}</div>
        <div class="names">${esc(coupleLabel(c))}</div>
        <div class="meta">${esc(fmtDate(c.date))}${c.venue ? ' · ' + esc(c.venue) : ''}</div>
        ${near.past
          ? `<div class="countdown"><div class="cd-box"><div class="n">礼成</div><div class="u">已圆满举行</div></div></div>`
          : `<div class="countdown" id="cd-live" data-date="${esc(c.date)}"></div>`}
        <div style="margin-top:24px">
          <button class="btn btn-ghost btn-sm" onclick="openCouple('${c.id}')">查看详情</button>
        </div>
      </div>`;
  }
  return `
  <div class="view">
    <div class="page-title">工作台</div>
    <div class="page-sub">愿每一场仪式，都被温柔以待</div>
    ${hero}
    <div class="grid-stats">
      <div class="card stat">
        <div class="label">新人档案</div>
        <div class="value">${total}<small>对</small></div>
        <div class="hint">累计服务的婚礼</div>
      </div>
      <div class="card stat">
        <div class="label">待办事项</div>
        <div class="value">${todos.length}<small>项</small></div>
        <div class="hint">来自全部沟通记录</div>
      </div>
      <div class="card stat">
        <div class="label">沟通记录</div>
        <div class="value">${state.couples.reduce((s,c)=>s+(c.comms||[]).length,0)}<small>条</small></div>
        <div class="hint">累计沟通留痕</div>
      </div>
    </div>
    <div class="section-head">
      <h3>待办汇总<span class="count-pill">${todos.length} 项待处理</span></h3>
    </div>
    <div class="card">
      ${todos.length ? `<div class="todo-list">${todos.map(t => `
        <div class="todo-item" id="todo-${t.todo.id}">
          <div class="todo-check" onclick="toggleTodo('${t.coupleId}','${t.commId}','${t.todo.id}')"></div>
          <div class="todo-body">
            <div class="todo-text">${esc(t.todo.text)}</div>
            <div class="todo-from">来自 <a onclick="openCouple('${t.coupleId}')">${esc(t.coupleName)}</a> 的沟通记录</div>
          </div>
        </div>`).join('')}</div>`
      : `<div class="empty"><span class="glyph">囍</span>所有待办均已处理完毕，好好享受此刻的从容</div>`}
    </div>
  </div>`;
}
let cdTimer = null;
function startCountdownTicker(){
  clearInterval(cdTimer);
  const tick = () => {
    const el = document.getElementById('cd-live');
    if(!el){ clearInterval(cdTimer); return; }
    const target = new Date(el.dataset.date + 'T00:00:00');
    let diff = target - new Date();
    if(diff < 0) diff = 0;
    const d = Math.floor(diff / 86400000);
    const h = Math.floor(diff % 86400000 / 3600000);
    const m = Math.floor(diff % 3600000 / 60000);
    const s = Math.floor(diff % 60000 / 1000);
    el.innerHTML = [
      [d,'天'],[h,'时'],[m,'分'],[s,'秒']
    ].map(([n,u]) => `<div class="cd-box"><div class="n">${String(n).padStart(2,'0')}</div><div class="u">${u}</div></div>`).join('');
  };
  tick();
  cdTimer = setInterval(tick, 1000);
}

/* ================= 新人档案 ================= */
function viewCouples(){
  const sorted = [...state.couples].sort((a,b) => (a.date||'9999') < (b.date||'9999') ? -1 : 1);
  return `
  <div class="view">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px">
      <div>
        <div class="page-title">新人档案</div>
        <div class="page-sub">共 ${state.couples.length} 对新人 · 点击卡片进入详情</div>
      </div>
      <button class="btn btn-gold" onclick="editCoupleForm()">＋ 新建档案</button>
    </div>
    ${state.couples.length ? `<div class="couple-grid">
      ${sorted.map(c => {
        const d = daysUntil(c.date);
        const badge = d === null ? ''
          : d >= 0 ? `<div class="cd-badge">还有 ${d} 天</div>`
          : `<div class="cd-badge past">已举行</div>`;
        return `
        <div class="card couple-card" onclick="openCouple('${c.id}')">
          ${badge}
          <div class="monogram">${esc((c.groom||'?').charAt(0))} · ${esc((c.bride||'?').charAt(0))}</div>
          <div class="couple-names">${esc(coupleLabel(c))}</div>
          <div class="couple-meta">
            <span>📅 ${esc(fmtDate(c.date))}</span>
            ${c.venue ? `<span>📍 ${esc(c.venue)}</span>` : ''}
            ${c.phone ? `<span>☎ ${esc(c.phone)}</span>` : ''}
          </div>
          <div class="card-actions" onclick="event.stopPropagation()">
            <button class="btn btn-ghost btn-sm" onclick="editCoupleForm('${c.id}')">编辑</button>
            <button class="btn btn-danger btn-sm" onclick="delCouple('${c.id}')">删除</button>
          </div>
        </div>`;
      }).join('')}
    </div>` : `<div class="card empty"><span class="glyph">囍</span>还没有新人档案，点击「新建档案」开始吧</div>`}
  </div>`;
}

function editCoupleForm(id){
  const c = id ? getCouple(id) : null;
  window.__coupleFormId = id || null;
  openModal(`
    <h3>${c ? '编辑档案' : '新建档案'}</h3>
    <div class="m-sub">带 * 为必填项；温馨提示与时间备注将用于导出打印</div>
    <div class="field"><label class="f">新郎姓名 *</label><input class="fi" id="f-groom" value="${esc(c?c.groom:'')}" placeholder="新郎姓名"></div>
    <div class="field"><label class="f">新娘姓名 *</label><input class="fi" id="f-bride" value="${esc(c?c.bride:'')}" placeholder="新娘姓名"></div>
    <div class="field"><label class="f">婚礼日期 *</label><input class="fi" type="date" id="f-date" value="${esc(c?c.date:'')}"></div>
    <div class="field"><label class="f">婚礼场地</label><input class="fi" id="f-venue" value="${esc(c?c.venue:'')}" placeholder="典礼酒店 · 宴会厅"></div>
    <div class="field"><label class="f">联系电话</label><input class="fi" id="f-phone" value="${esc(c?c.phone:'')}" placeholder="新人或联络人电话"></div>
    <div class="field"><label class="f">备注</label><textarea class="fi" id="f-notes" placeholder="风格偏好、特殊环节、注意事项…">${esc(c?c.notes:'')}</textarea></div>
    <div class="field"><label class="f">温馨提示（导出流程单用，每行一条）</label><textarea class="fi" id="f-tips" placeholder="婚礼前一天请注意早点休息…">${esc(c?c.tips:'')}</textarea></div>
    <div class="field"><label class="f">时间参考表页脚备注</label><textarea class="fi" id="f-schednote" placeholder="留空则使用默认路程参考说明">${esc(c?c.scheduleNote:'')}</textarea></div>
    <div class="m-btns">
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">取消</button>
      <button class="btn btn-gold btn-sm" onclick="saveCoupleForm()">保存</button>
    </div>`);
  setTimeout(() => document.getElementById('f-groom').focus(), 60);
}
function saveCoupleForm(){
  const v = k => document.getElementById(k).value.trim();
  const groom = v('f-groom'), bride = v('f-bride'), date = v('f-date');
  if(!groom || !bride || !date){ toast('请填写新郎、新娘姓名与婚礼日期'); return; }
  const data = { groom, bride, date, venue: v('f-venue'), phone: v('f-phone'), notes: v('f-notes'), tips: v('f-tips'), scheduleNote: v('f-schednote') };
  const id = window.__coupleFormId;
  if(id){
    Object.assign(getCouple(id), data);
    toast('档案已更新');
  } else {
    const nid = uid();
    state.couples.push(Object.assign({ id: nid, comms: [], flow: [], timeline: [] }, data));
    toast('档案已创建');
    closeModal();
    save(); openCouple(nid); return;
  }
  closeModal(); save(); render();
}
function delCouple(id){
  const c = getCouple(id);
  confirmBox('删除档案', `确定删除「${coupleLabel(c)}」的档案吗？其沟通记录、流程与时间线将一并删除，且无法恢复。`, '删除档案', () => {
    state.couples = state.couples.filter(x => x.id !== id);
    save();
    if(view.name === 'detail' && view.coupleId === id) go('couples'); else render();
    toast('档案已删除');
  });
}
</script>
